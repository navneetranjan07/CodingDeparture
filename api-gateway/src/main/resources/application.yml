server:
  port: 8102

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        # 1. Auth Service Route
        - id: auth-service
          uri: http://localhost:8103
          predicates:
            - Path=/auth/**

        # 2. Battle Service Route
        - id: battle-service
          uri: http://localhost:8104
          predicates:
            - Path=/battle/**, /ws/**

        # 3. Content AI Service Route
        - id: content-ai-service
          uri: http://localhost:8105
          predicates:
            - Path=/content/**

      # Global CORS Configuration
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: "*" 
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders: "*"